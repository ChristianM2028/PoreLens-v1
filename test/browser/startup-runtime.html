<!doctype html><meta charset="utf-8"><pre id="result">waiting</pre><iframe id="app" style="width:1400px;height:1000px"></iframe>
<script type="module">
const result=document.querySelector('#result'),frame=document.querySelector('#app'),wait=async(fn,ms=12000)=>{const end=Date.now()+ms;while(Date.now()<end){const v=fn();if(v)return v;await new Promise(r=>setTimeout(r,20))}throw new Error('timeout')};
const hashes=['','#adsorption-isotherms','#rdf-workspace','#end-to-end-histograms','#trajectory-energetics'];
const reports=[];
try{
 for(const hash of hashes){frame.src=`../../index.html${hash}`;await new Promise((ok,no)=>{frame.onload=ok;setTimeout(()=>no(Error('load timeout')),10000)});const w=frame.contentWindow,d=w.document,errors=[];w.addEventListener('error',e=>errors.push(e.message));w.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));await wait(()=>w.porelensStartup);const expected=hash.slice(1)||'adsorption-isotherms',visible=[...d.querySelectorAll('[data-analysis-workspace]')].filter(x=>!x.hidden);if(visible.length!==1||visible[0].id!==expected)throw Error(`visibility ${hash}: ${visible.map(x=>x.id)}`);if(!d.querySelector('#chainCanvas')||!d.querySelector('#chainDatasets'))throw Error('isotherm shell missing');for(const link of d.querySelectorAll('[data-workspace]')){link.click();await wait(()=>[...d.querySelectorAll('[data-analysis-workspace]')].filter(x=>!x.hidden)[0]?.dataset.analysisWorkspace===link.dataset.workspace)}const statuses=[...d.querySelectorAll('#startupStatus li')].map(x=>[x.dataset.stage,x.dataset.status]);if(statuses.some(([,s])=>s!=='ready'))throw Error(`not ready ${JSON.stringify(statuses)}`);if(errors.length)throw Error(errors.join('\n'));reports.push({hash,statuses})}
 frame.src='../../index.html?fail-stage=rdf';await new Promise(ok=>frame.onload=ok);const w=frame.contentWindow,d=w.document;await wait(()=>w.porelensStartup);if(d.querySelector('#adsorption-isotherms').hidden)throw Error('degraded isotherm hidden');if(d.querySelector('[data-stage="rdf"]').dataset.status!=='failed')throw Error('RDF failure absent');if(d.querySelector('[data-stage="directory-import"]').dataset.status!=='failed'||!d.querySelector('#chooseDirectoryA')?.disabled)throw Error('directory selection was enabled before consumers');if(!/catalog only/i.test(d.querySelector('#scanState').textContent))throw Error('catalog-only diagnostic absent');if(!d.querySelector('#startupStatus').dataset.degraded)throw Error('degraded status absent');result.textContent=JSON.stringify({ok:true,reports,degraded:true});
}catch(error){result.textContent=JSON.stringify({ok:false,error:error.stack||error.message,reports})}
</script>
